<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2E4A" />
      <stop offset="100%" stop-color="#111E31" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED7BA" />
      <stop offset="100%" stop-color="#B08948" />
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#B08948" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Notebook / Ledger Icon -->
  <g transform="translate(106, 96)">
    <!-- Book Body -->
    <rect x="30" y="20" width="240" height="280" rx="16" fill="#FDFCF9" stroke="#EAE1D2" stroke-width="6" />
    
    <!-- Spine binding -->
    <rect x="30" y="20" width="34" height="280" rx="4" fill="#B08948" />
    <circle cx="47" cy="60" r="6" fill="#1B2E4A" />
    <circle cx="47" cy="120" r="6" fill="#1B2E4A" />
    <circle cx="47" cy="180" r="6" fill="#1B2E4A" />
    <circle cx="47" cy="240" r="6" fill="#1B2E4A" />

    <!-- Clothing Tag floating overlay -->
    <g transform="translate(130, 90) rotate(12)">
      <path d="M 0 30 L 30 0 L 110 0 C 116 0 120 4 120 10 L 120 150 C 120 156 116 160 110 160 L 10 160 C 4 160 0 156 0 150 Z" fill="#1B2E4A" stroke="#B08948" stroke-width="5" />
      <circle cx="30" cy="30" r="8" fill="#FDFCF9" />
      <!-- Tag string -->
      <path d="M 30 30 C 20 -20, 60 -40, 50 -70" fill="none" stroke="#B08948" stroke-width="4" stroke-linecap="round" />
      <!-- Price symbol lines inside tag -->
      <line x1="30" y1="75" x2="90" y2="75" stroke="#EED7BA" stroke-width="5" stroke-linecap="round" />
      <line x1="30" y1="105" x2="80" y2="105" stroke="#EED7BA" stroke-width="5" stroke-linecap="round" />
      <line x1="30" y1="130" x2="65" y2="130" stroke="#B08948" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Ledger lines -->
    <line x1="85" y1="70" x2="160" y2="70" stroke="#B08948" stroke-width="5" stroke-linecap="round" />
    <line x1="85" y1="110" x2="140" y2="110" stroke="#DED8CC" stroke-width="4" stroke-linecap="round" />
    <line x1="85" y1="150" x2="130" y2="150" stroke="#DED8CC" stroke-width="4" stroke-linecap="round" />
    <line x1="85" y1="190" x2="150" y2="190" stroke="#DED8CC" stroke-width="4" stroke-linecap="round" />
    <line x1="85" y1="230" x2="230" y2="230" stroke="#DED8CC" stroke-width="4" stroke-linecap="round" />
    <line x1="85" y1="265" x2="210" y2="265" stroke="#DED8CC" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Title typography -->
  <text x="256" y="445" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#EED7BA" text-anchor="middle" letter-spacing="1">دَفْـتَـر</text>
</svg>
